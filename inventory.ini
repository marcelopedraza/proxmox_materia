# inventory.ini – Proxmox cluster nodes for the course lab
#
# Adjust hostnames / IP addresses to match your actual cluster.
# The variable "node_index" is set per host so that Ansible can map
# students to nodes using the formula:  node_index = student_id % 6

[proxmox_nodes]
pve1 ansible_host=192.168.1.101 node_index=0
pve2 ansible_host=192.168.1.102 node_index=1
pve3 ansible_host=192.168.1.103 node_index=2
pve4 ansible_host=192.168.1.104 node_index=3
pve5 ansible_host=192.168.1.105 node_index=4
pve6 ansible_host=192.168.1.106 node_index=5

[proxmox_nodes:vars]
ansible_user=root
# Use SSH key-based auth; set ansible_ssh_private_key_file if needed.
# ansible_ssh_private_key_file=~/.ssh/proxmox_key
ansible_python_interpreter=/usr/bin/python3
