# inventory.ini – Proxmox cluster nodes for the course lab
#
# Adjust hostnames / IP addresses to match your actual cluster.
# The variable "node_index" is set per host so that Ansible can map
# students to nodes using the formula:  node_index = student_id % num_nodes
#
# Configured for the full 6-node cluster. node_index must be 0..num_nodes-1
# and match the order of proxmox_nodes in group_vars/all.yml.
#
# "pve_node_name" is the node's REAL name inside the Proxmox cluster (as
# shown by `pvesh get /nodes` / the PVE UI) — it does not have to match the
# ansible inventory alias on the left. Cross-node operations like
# `qm clone --target` and `pct clone --target` need this real name, not the
# ansible alias.

[proxmox_nodes]
pve1 ansible_host=157.92.12.1 node_index=0 pve_node_name=tr1
pve2 ansible_host=157.92.12.2 node_index=1 pve_node_name=tr2
pve3 ansible_host=157.92.12.3 node_index=2 pve_node_name=tr3
pve4 ansible_host=157.92.12.4 node_index=3 pve_node_name=tr4
pve5 ansible_host=157.92.12.5 node_index=4 pve_node_name=tr5
pve6 ansible_host=157.92.12.6 node_index=5 pve_node_name=tr6

[proxmox_nodes:vars]
ansible_user=root
# Use SSH key-based auth; set ansible_ssh_private_key_file if needed.
# ansible_ssh_private_key_file=~/.ssh/proxmox_key
ansible_python_interpreter=/usr/bin/python3
