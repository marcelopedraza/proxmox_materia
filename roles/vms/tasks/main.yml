---
# roles/vms/tasks/main.yml
# Clone (or destroy) the pfSense VM for a student from the shared template.
#
# The VM is created with only its WAN interface (net0) wired up. Students
# attach net1/net2/net3 to whichever of their pool's LAN bridges they choose,
# using the VM.Config.Network privilege their role already grants.
#
# Expected variables:
#   student_id      – integer student identifier
#   state           – "present" (default) or "absent"
# Uses group_vars: vm_template_id, base_vm_id, vm_storage, wan_bridge,
#                  student_role (from pools role)

- name: "Set VM facts for student{{ student_id }}"
  ansible.builtin.set_fact:
    vm_id: "{{ base_vm_id | int + student_id | int }}"
    vm_name: "student{{ student_id }}-pfsense"
    pool_name: "student{{ student_id }}"

# ---- Create VM ----
- name: "Check if VM {{ vm_id }} already exists"
  ansible.builtin.command:
    cmd: qm status {{ vm_id }}
  register: vm_status
  failed_when: false
  changed_when: false
  when: state | default('present') == 'present'

- name: "Clone pfSense VM from template {{ vm_template_id }} → {{ vm_id }}"
  ansible.builtin.command:
    cmd: >
      qm clone {{ vm_template_id }} {{ vm_id }}
      --name {{ vm_name }}
      --full 1
      --storage {{ vm_storage }}
  when:
    - state | default('present') == 'present'
    - vm_status.rc != 0   # rc != 0 means the VM does not exist yet
  changed_when: true

- name: "Configure WAN interface on VM {{ vm_id }}"
  ansible.builtin.command:
    cmd: >
      qm set {{ vm_id }}
      --net0 virtio,bridge={{ wan_bridge }}
  when:
    - state | default('present') == 'present'
    - vm_status.rc != 0
  changed_when: true

# Not gated on vm_status.rc: always (re-)attempted so that a retry after a
# mid-playbook failure still adds an already-cloned VM to its pool, instead
# of silently skipping it because the clone step is now a no-op.
- name: "Add VM {{ vm_id }} to pool {{ pool_name }}"
  ansible.builtin.command:
    cmd: pveum pool modify {{ pool_name }} --vms {{ vm_id }}
  when: state | default('present') == 'present'
  register: pool_add_vm
  failed_when:
    - pool_add_vm.rc != 0
    - "'already a pool member' not in pool_add_vm.stderr"
  changed_when: pool_add_vm.rc == 0

# ---- Delete VM ----
- name: "Stop VM {{ vm_id }} if running"
  ansible.builtin.command:
    cmd: qm stop {{ vm_id }}
  when: state | default('present') == 'absent'
  failed_when: false
  changed_when: true

- name: "Destroy VM {{ vm_id }}"
  ansible.builtin.command:
    cmd: qm destroy {{ vm_id }} --purge 1
  when: state | default('present') == 'absent'
  failed_when: false
  changed_when: true
