---
# roles/networking/tasks/main.yml
# Create (or delete) the per-student LAN bridges on the target Proxmox node.
# Each student gets `num_lan_networks` isolated bridges, named
# "vmbr{{ base_lan_bridge_id + student_id*10 + net_index }}".
#
# These bridges are NOT auto-wired to pfSense or the containers — students
# attach them manually using the VM.Config.Network privilege on their role.
#
# Expected variables:
#   student_id   – integer student identifier
#   state        – "present" (default) or "absent"

- name: "Manage LAN bridges for student{{ student_id }}"
  ansible.builtin.include_tasks: manage_bridge.yml
  vars:
    net_index: "{{ item }}"
    lan_bridge: "vmbr{{ base_lan_bridge_id | int + student_id | int * 10 + item | int }}"
  loop: "{{ range(0, num_lan_networks | int) | list }}"
