---
# roles/containers/tasks/create_container.yml
# Creates a single LXC container for the current ct_index.
# Called in a loop from main.yml.
#
# Containers are created without a pre-wired net0. Students attach each
# container's net0 to whichever of their pool's LAN bridges they choose,
# using the VM.Config.Network privilege their role already grants.

- name: "Set facts for container index {{ ct_index }}"
  ansible.builtin.set_fact:
    ct_id: "{{ base_ct_id | int + student_id | int * 10 + ct_index | int }}"
    ct_name: "student{{ student_id }}-ct{{ ct_index }}"

- name: "Check if container {{ ct_id }} already exists"
  ansible.builtin.command:
    cmd: pct status {{ ct_id }}
  register: ct_status
  failed_when: false
  changed_when: false

# Templates live on local (non-shared) storage, so the clone must run FROM
# the node that actually holds template {{ ct_template_id }} (template_node),
# targeting this node by its real Proxmox node name — see the analogous
# comment in roles/vms/tasks/main.yml.
- name: "Clone LXC container from template {{ ct_template_id }} → {{ ct_id }}"
  ansible.builtin.command:
    cmd: >
      pct clone {{ ct_template_id }} {{ ct_id }}
      --hostname {{ ct_name }}
      --storage {{ ct_storage }}
      --full 1
      {{ '' if inventory_hostname == template_node else '--target ' + pve_node_name }}
  delegate_to: "{{ template_node }}"
  when: ct_status.rc != 0   # rc != 0 means the container does not exist
  changed_when: true

# Not gated on ct_status.rc: always (re-)attempted so that a retry after a
# mid-playbook failure still adds an already-cloned container to its pool,
# instead of silently skipping it because the clone step is now a no-op.
- name: "Add container {{ ct_id }} to pool {{ pool_name }}"
  ansible.builtin.command:
    cmd: pveum pool modify {{ pool_name }} --vms {{ ct_id }}
  register: pool_add_ct
  failed_when:
    - pool_add_ct.rc != 0
    - "'already a pool member' not in pool_add_ct.stderr"
  changed_when: pool_add_ct.rc == 0
