---
# roles/containers/tasks/main.yml
# Clone (or destroy) the four LXC containers for a student.
# Container IDs:  base_ct_id + student_id * 10 + index  (index 0..3)
# Container names: student<ID>-ct0 … student<ID>-ct3
#
# Expected variables:
#   student_id      – integer student identifier
#   state           – "present" (default) or "absent"
# Uses group_vars: ct_template_id, base_ct_id, ct_storage, num_containers

- name: "Set container facts for student{{ student_id }}"
  ansible.builtin.set_fact:
    pool_name: "student{{ student_id }}"
    lan_bridge: "vmbr10{{ student_id }}"
    ct_indexes: "{{ range(0, num_containers | int) | list }}"

# ---- Create containers ----
- name: "Process container {{ ct_index }} for student{{ student_id }}"
  ansible.builtin.include_tasks: create_container.yml
  loop: "{{ ct_indexes }}"
  loop_control:
    loop_var: ct_index
  when: state | default('present') == 'present'

# ---- Delete containers ----
- name: "Destroy container {{ ct_index }} for student{{ student_id }}"
  ansible.builtin.include_tasks: destroy_container.yml
  loop: "{{ ct_indexes }}"
  loop_control:
    loop_var: ct_index
  when: state | default('present') == 'absent'
