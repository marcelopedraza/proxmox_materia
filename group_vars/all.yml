---
# group_vars/all.yml – Global variables for the Proxmox course automation
# Edit these values to customise the deployment for each course run.

# ---------------------------------------------------------------------------
# Cluster topology
# ---------------------------------------------------------------------------
# Ordered list of node hostnames (must match inventory.ini).
# Currently a single node. Add hostnames here (and to inventory.ini) to grow
# back to a multi-node cluster later.
proxmox_nodes:
  - pve1
  - pve2
  - pve3
  - pve4
  - pve5
  - pve6

num_nodes: 6   # Must match the length of proxmox_nodes (uncommented entries above)

# ---------------------------------------------------------------------------
# Student settings
# ---------------------------------------------------------------------------
num_students: 2          # Total number of student environments to provision
student_id_start: 1       # First student ID (inclusive)
# Student IDs will be: student_id_start .. student_id_start + num_students - 1

# ---------------------------------------------------------------------------
# Template IDs
# ---------------------------------------------------------------------------
vm_template_id: 9000      # Proxmox VM template for pfSense
ct_template_id: 8000      # Proxmox CT template for LXC containers

# Inventory alias of the node holding the templates above. Templates live on
# local (non-shared) storage, so cloning onto a different node must be a
# cross-node "remote clone" (qm/pct clone --target <node>) run FROM this
# node, rather than a local clone run on the target node itself.
template_node: pve1

# ---------------------------------------------------------------------------
# VM / Container ID bases
# ---------------------------------------------------------------------------
base_vm_id: 1000          # Student VM  ID = base_vm_id + student_id
base_ct_id: 2000          # Student CT  ID = base_ct_id + student_id * 10 + ct_index
num_containers: 4         # Number of LXC containers per student (ct0 … ct3)

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
vm_storage: local-lvm     # Storage pool for VM disks
ct_storage: local-lvm     # Storage pool for container rootfs

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
wan_bridge: vmbr0         # Shared WAN bridge (all students share this)
# WAN uplink NIC on each Proxmox node, bridged into vmbr0. Same across all
# 6 nodes. MUST be filled in with the real NIC name (e.g. "eno1") before
# running deploy.yml / setup_wan_bridge.sh.
wan_uplink_interface: "enp3s0"

num_lan_networks: 3      # Number of isolated LAN bridges provisioned per pool
base_lan_bridge_id: 100  # Bridge name = "vmbr{{ base_lan_bridge_id + student_id*10 + net_index }}"
# e.g. student 7 → vmbr170, vmbr171, vmbr172

# ---------------------------------------------------------------------------
# Roles / Permissions
# ---------------------------------------------------------------------------
student_role: StudentLab  # Custom Proxmox role granted to each student on their pool
student_role_privileges:  # Baseline PVEVMUser privileges + snapshot management
  - VM.Audit          # Required to see VMs/CTs in the resource tree and search
  - Pool.Audit        # Required to see the pool itself in the resource tree
  - Sys.Audit         # Required to list node bridges in the network device dropdown
  - VM.Config.CDROM
  - VM.Config.Cloudinit
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.Console
  - VM.PowerMgmt
  - VM.Snapshot
  - VM.Snapshot.Rollback

# ---------------------------------------------------------------------------
# Script paths (relative to the repo root, executed on remote nodes)
# ---------------------------------------------------------------------------
scripts_remote_dir: /opt/proxmox-course/scripts
